<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilos_PR.css">
    <style>
        .seccion-item { margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: white; }
        .titulo-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; font-weight: bold; }
        .contenido-seccion { display: none; padding: 20px; border-top: 1px solid #e2e8f0; }
        .btn-desplegar { width: 30px; height: 30px; cursor: pointer; }
        img {transition: transform 0.3s ease;}
        .rotada {transform: rotate(180deg);transition: transform 0.3s ease;}
        .contenido-flex {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

/* IZQUIERDA */
.col-izquierda {
    flex: 2; /* ocupa más espacio */
}

/* DERECHA */
.col-derecha {
    flex: 1;
    display: flex;
    flex-direction: column; /* 🔥 uno encima del otro */
    align-items: center; /* centra horizontal */
    gap: 10px;
}
    </style>
</head>
<body>

<nav class="nav-top">
    <a href="index.html" class="btn-back">← Volver</a>
</nav>

<div class="wrapper">
    <header>
        <h1>Certificaciones Profesionales</h1>
        <p>Resumen de competencias y evidencias</p>
    </header>

    <div class="seccion-item">
    <div class="titulo-header" onclick="toggleSeccion(this)">
        <span>1. Introducción a la ciberceguridad</span>
        <img src="desplegar.png" class="btn-desplegar" data-abierto="false">
    </div>
    <div class="contenido-seccion">
    
    <div class="contenido-flex"> <!-- 🔥 contenedor principal -->

        <!-- IZQUIERDA -->
        <div class="col-izquierda">
            <p>Aquí va el resumen de 250 palabras de tu certificación...</p>
        </div>

        <!-- DERECHA -->
        <div class="col-derecha">
            <div data-iframe-width="150" data-iframe-height="270"
                 data-share-badge-id="544c38d8-e527-4aba-8eb8-aad9aff4579a"
                 data-share-badge-host="https://www.credly.com">
            </div>

            <a href="actividades/Introduction_to_Cybersecurity_certificate_173877-upslp-edu-mx_ca90a3fa-4721-462b-855e-fc113337c19e.pdf"
               target="_blank" rel="noopener noreferrer"
               class="btn-back">
               Ver Evidencia PDF
            </a>
        </div>

    </div>

</div>
</div>

    </div>

<script>
    function toggleSeccion(header) {
        const contenido = header.nextElementSibling;
        const img = header.querySelector('img');
    
        if (img.getAttribute('data-abierto') === 'true') {
            // CERRAR
            contenido.style.display = 'none';
            img.classList.remove('rotada');
            img.setAttribute('data-abierto', 'false');
        } else {
            // ABRIR
            contenido.style.display = 'block';
            img.classList.add('rotada');
            img.setAttribute('data-abierto', 'true');
        }
    }
</script>
<script type="text/javascript" async src="//cdn.credly.com/assets/utilities/embed.js"></script>
</body>
</html>
